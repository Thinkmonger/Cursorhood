<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-i18n-page="statistics">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Statistics — Cursorhood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/theme.css?v=20261005h" />
</head>
<body class="app-body app-scroll">

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="/" data-i18n="app.nameShort">Cursorhood</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul id="app-nav" class="navbar-nav ms-auto align-items-lg-center gap-lg-1"></ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4 px-3 px-lg-4">

    <div class="bot-manage-header mb-3">
      <div>
        <h1 class="h4 mb-1" data-i18n="stats.pageTitle">Performance statistics</h1>
        <p class="text-secondary small mb-0" data-i18n="stats.subtitle">Live cycle status, usage, and per-bot performance from run history.</p>
      </div>
      <div id="stats-as-of" class="text-secondary small"></div>
    </div>

    <ul class="nav nav-tabs mb-4" id="stats-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" type="button" data-tab="overview" role="tab" data-i18n="stats.tabOverview">Overview</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" type="button" data-tab="bots" role="tab" data-i18n="stats.tabBots">Bots</button>
      </li>
    </ul>

    <div id="panel-overview">
      <div id="aggregate-kpis" class="row g-3 mb-4">
        <div class="col-12 text-secondary small" data-i18n="stats.loading">Loading statistics…</div>
      </div>
      <div id="system-card"></div>
    </div>

    <div id="panel-bots" class="d-none">
      <div class="d-flex justify-content-end mb-3">
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary active" id="view-cards" onclick="setView('cards')" data-i18n="stats.viewCards">Cards</button>
          <button class="btn btn-outline-secondary" id="view-table" onclick="setView('table')" data-i18n="stats.viewTable">Table</button>
        </div>
      </div>
      <div id="cards-view" class="row g-3"></div>
      <div id="table-view" class="rh-card d-none">
        <div class="table-responsive">
          <table class="table table-dark table-hover mb-0 align-middle">
            <thead>
              <tr>
                <th data-i18n="stats.tableBot">Bot</th>
                <th data-i18n="stats.tableStatus">Scheduler</th>
                <th data-i18n="stats.tableLastRunStatus">Last run</th>
                <th data-i18n="stats.tableRuns">Runs</th>
                <th data-i18n="stats.tableSuccess">Success</th>
                <th data-i18n="stats.tableTrades">Trades</th>
                <th data-i18n="stats.tablePortfolio">Portfolio</th>
                <th data-i18n="stats.tableLastRun">Last run at</th>
              </tr>
            </thead>
            <tbody id="stats-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast rh-toast text-bg-dark border border-success" role="alert">
    <div class="toast-body"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/i18n.js?v=20261005h"></script>
  <script src="/static/app.js?v=20261005h"></script>
  <script src="/static/footer.js?v=20261005h"></script>
  <script src="/static/statistics.js?v=20261005h"></script>
</body>
</html>

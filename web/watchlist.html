<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-i18n-page="watchlist">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchlist — Robinhood Agentic Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/theme.css?v=20261004a" />
</head>
<body class="app-body app-scroll">

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="/" data-i18n="app.name">Robinhood Agentic Console</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul id="app-nav" class="navbar-nav ms-auto align-items-lg-center gap-lg-1"></ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4 px-3 px-lg-4">
    <div class="mb-3">
      <a href="/research" class="small text-secondary text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i><span data-i18n="watchlist.backToResearch">Research</span>
      </a>
      <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
        <h1 id="watchlist-title" class="h4 mb-0">—</h1>
        <span id="watchlist-origin" class="badge text-bg-secondary d-none"></span>
        <span id="watchlist-count" class="text-secondary small"></span>
      </div>
    </div>
    <div id="watchlist-status" class="text-secondary small mb-3"></div>
    <div id="watchlist-grid" class="row g-3"></div>
  </main>

  <div id="toast" class="toast rh-toast text-bg-dark border border-success" role="alert">
    <div class="toast-body"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/i18n.js?v=20260529l"></script>
  <script src="/static/app.js?v=20261004a"></script>
  <script src="/static/footer.js?v=20260529l"></script>
  <script src="/static/watchlist.js?v=20260920"></script>
</body>
</html>
